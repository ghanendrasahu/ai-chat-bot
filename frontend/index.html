<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#080a0e" />
    <meta name="color-scheme" content="dark light" />
    <!-- Resolves the theme before first paint, so "system" never flashes the
         wrong colours while React boots. Kept in sync by useSettings. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("mira.settings.v1") || "{}");
          var theme =
            saved.theme === "light" || saved.theme === "dark"
              ? saved.theme
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "light" ? "#e9edf2" : "#080a0e");
          }
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta
      name="description"
      content="Mira is a friendly AI chat companion for questions, planning and drafting."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mira" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mira - AI chat</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mira - AI chat" />
    <meta
      property="og:description"
      content="A friendly AI chat companion for questions, planning and drafting."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
